<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Khudkibook — GTU Notices</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink:        #0C0D10;
    --ink-soft:   #14161B;
    --paper:      #F6F2EC;
    --paper-dim:  #9A958C;
    --accent:     #CD5D33;
    --hairline:   rgba(246, 242, 236, 0.14);
    --margin:     96px;
  }

  html, body { background: var(--ink); }

  #post-canvas {
    width: 1080px; height: 1080px;
    min-width: 1080px; min-height: 1080px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #1B1E25 0%, transparent 60%),
      linear-gradient(to bottom, #0C0D10 0%, #0F1116 55%, #121319 100%);
    color: var(--paper);
    font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* A single whisper of warmth, low and centred. Nothing more. */
  .glow {
    position: absolute; left: 50%; bottom: -280px; transform: translateX(-50%);
    width: 900px; height: 560px;
    background: radial-gradient(closest-side, rgba(205,93,51,0.16) 0%, transparent 100%);
  }

  .frame { position: absolute; inset: 0; padding: 0 var(--margin); }

  /* ---------- masthead ---------- */
  .masthead {
    position: absolute; top: 82px; left: var(--margin); right: var(--margin);
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; background: #fff; padding: 4px; }
  .wordmark { font-size: 21px; font-weight: 700; letter-spacing: 6.5px; }
  .rule-top { position: absolute; top: 172px; left: var(--margin); right: var(--margin); height: 1px; background: var(--hairline); }
  .launch {
    font-size: 15px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: var(--accent);
  }

  /* ---------- headline block ---------- */
  .block { position: absolute; left: var(--margin); right: var(--margin); top: 252px; }
  .eyebrow {
    display: flex; align-items: center; gap: 16px;
    font-size: 18px; font-weight: 700; letter-spacing: 5.5px; text-transform: uppercase;
    color: var(--accent); margin-bottom: 34px;
  }
  .eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }

  h1 {
    font-family: 'Bodoni 72', 'Didot', Didot, Georgia, serif;
    font-size: 96px; font-weight: 400; line-height: 1.04;
    letter-spacing: -1.5px;
    color: var(--paper);
  }
  h1 em { font-style: italic; color: var(--accent); }

  .standfirst {
    margin-top: 34px; max-width: 760px;
    font-size: 29px; font-weight: 400; line-height: 1.62;
    color: var(--paper-dim); letter-spacing: 0.1px;
  }
  .standfirst strong { color: var(--paper); font-weight: 600; }

  /* ---------- the page, reduced to a single line ---------- */
  .preview { position: absolute; left: var(--margin); right: var(--margin); top: 690px; }
  .preview-hair { height: 1px; background: var(--hairline); }
  .preview-label {
    margin-top: 26px;
    font-size: 15px; font-weight: 700; letter-spacing: 4.4px; text-transform: uppercase;
    color: var(--paper-dim);
  }
  .preview-row { display: flex; align-items: baseline; gap: 30px; margin-top: 22px; }
  .preview-date {
    flex: 0 0 auto; font-size: 17px; font-weight: 600;
    letter-spacing: 2.6px; text-transform: uppercase; color: var(--accent);
  }
  .preview-text { font-size: 27px; font-weight: 400; line-height: 1.35; color: var(--paper); }
  .preview-hair.foot { margin-top: 30px; }

  /* ---------- footer ---------- */
  .footer {
    position: absolute; left: var(--margin); right: var(--margin); bottom: 78px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .cta { font-size: 25px; font-weight: 600; letter-spacing: 0.6px; }
  .cta span { color: var(--accent); }
  .fine { margin-top: 9px; font-size: 17px; color: var(--paper-dim); letter-spacing: 1.6px; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="post-canvas">
    <div class="glow"></div>

    <div class="frame">
      <div class="masthead">
        <div class="brand">
          <img src="/assets/brand/khudkibook-logo.png" alt="Khudkibook" />
          <div class="wordmark">KHUDKIBOOK</div>
        </div>
        <div class="launch">New</div>
      </div>
      <div class="rule-top"></div>

      <div class="block">
        <div class="eyebrow">GTU Notices</div>
        <h1>Every GTU<br />circular, <em>one page.</em></h1>
        <p class="standfirst">
          Results, exam forms, syllabus and calendar &mdash; read from
          <strong>gtu.ac.in</strong> automatically.
        </p>
      </div>

      <div class="preview">
        <div class="preview-hair"></div>
        <div class="preview-label">Latest notice</div>
        <div class="preview-row">
          <div class="preview-date">25 Sep</div>
          <div class="preview-text">Result Declaration &mdash; BBA Sem 4 Recheck, Summer 2026</div>
        </div>
        <div class="preview-hair foot"></div>
      </div>

      <div class="footer">
        <div>
          <div class="cta">khudkibook.in/<span>gtu-notices</span></div>
          <div class="fine">Free &middot; No login &middot; Link in bio</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
