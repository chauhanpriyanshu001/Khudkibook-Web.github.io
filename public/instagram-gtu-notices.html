<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Khudkibook — GTU Notices</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink:        #0C0D10;
    --paper:      #F6F2EC;
    --paper-dim:  #9A958C;
    --accent:     #CD5D33;
    --hairline:   rgba(246, 242, 236, 0.14);
    --margin:     88px;
  }

  html, body { background: var(--ink); }

  #post-canvas {
    width: 1080px; height: 1080px;
    min-width: 1080px; min-height: 1080px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(120% 80% at 50% -10%, #1B1E25 0%, transparent 60%),
      linear-gradient(to bottom, #0C0D10 0%, #0F1116 55%, #121319 100%);
    color: var(--paper);
    font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .glow {
    position: absolute; left: 50%; bottom: -300px; transform: translateX(-50%);
    width: 900px; height: 560px;
    background: radial-gradient(closest-side, rgba(205,93,51,0.15) 0%, transparent 100%);
  }

  /* ---------- masthead ---------- */
  .masthead {
    position: absolute; top: 82px; left: var(--margin); right: var(--margin);
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; background: #fff; padding: 4px; }
  .wordmark { font-size: 21px; font-weight: 700; letter-spacing: 6.5px; }
  .rule-top { position: absolute; top: 172px; left: var(--margin); right: var(--margin); height: 1px; background: var(--hairline); }
  .launch { font-size: 15px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); }

  /* ---------- stage ---------- */
  .stage {
    position: absolute; left: var(--margin); right: var(--margin); top: 232px;
    display: flex; align-items: center; gap: 64px;
  }
  .copy { flex: 0 0 480px; }

  .eyebrow {
    display: flex; align-items: center; gap: 16px; margin-bottom: 32px;
    font-size: 17px; font-weight: 700; letter-spacing: 5.2px; text-transform: uppercase;
    color: var(--accent);
  }
  .eyebrow::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }

  h1 {
    font-family: 'Bodoni 72', 'Didot', Didot, Georgia, serif;
    font-size: 76px; font-weight: 400; line-height: 1.07; letter-spacing: -1px;
  }
  h1 em { font-style: italic; color: var(--accent); }

  .standfirst {
    margin-top: 32px;
    font-size: 26px; font-weight: 400; line-height: 1.62; color: var(--paper-dim);
  }
  .standfirst strong { color: var(--paper); font-weight: 600; }

  /* ---------- the same page, two widths ---------- */
  .cluster { position: relative; flex: 0 0 360px; height: 664px; }

  .browser {
    position: absolute; top: 18px; left: 0; width: 360px; height: 256px;
    border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
  }
  .bar {
    height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 13px;
    background: #EDEAE5; border-bottom: 1px solid rgba(0,0,0,0.07);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,0.20); }
  .shot { width: 100%; height: 230px; overflow: hidden; }
  .shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  .device {
    position: absolute; top: 94px; left: 60px; width: 280px; height: 570px;
    padding: 6px; border-radius: 42px;
    background: linear-gradient(150deg, #F2EEE7 0%, #D9D4CB 55%, #C7C2B9 100%);
    box-shadow: 0 44px 90px rgba(0,0,0,0.62);
  }
  .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: #fff; }
  .screen img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }

  /* ---------- footer ---------- */
  .footer { position: absolute; left: var(--margin); right: var(--margin); bottom: 76px; }
  .cta { font-size: 25px; font-weight: 600; letter-spacing: 0.6px; }
  .cta span { color: var(--accent); }
  .fine { margin-top: 9px; font-size: 16px; color: var(--paper-dim); letter-spacing: 1.8px; text-transform: uppercase; }
</style>
</head>
<body>
  <div id="post-canvas">
    <div class="glow"></div>

    <div class="masthead">
      <div class="brand">
        <img src="/assets/brand/khudkibook-logo.png" alt="Khudkibook" />
        <div class="wordmark">KHUDKIBOOK</div>
      </div>
      <div class="launch">New</div>
    </div>
    <div class="rule-top"></div>

    <div class="stage">
      <div class="copy">
        <div class="eyebrow">GTU Notices</div>
        <h1>Every GTU<br />circular,<br /><em>one page.</em></h1>
        <p class="standfirst">
          Results, exam forms, syllabus and calendar &mdash; read from
          <strong>gtu.ac.in</strong> automatically.
        </p>
      </div>

      <div class="cluster">
        <div class="browser">
          <div class="bar">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          </div>
          <div class="shot">
            <img src="/assets/brand/gtu-notices-desktop.png" alt="Desktop view of khudkibook.in/gtu-notices" />
          </div>
        </div>

        <div class="device">
          <div class="screen">
            <img src="/assets/brand/gtu-notices-mobile.png" alt="Mobile view of khudkibook.in/gtu-notices" />
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div class="cta">khudkibook.in/<span>gtu-notices</span></div>
      <div class="fine">Free &middot; No login &middot; Link in bio</div>
    </div>
  </div>
</body>
</html>
